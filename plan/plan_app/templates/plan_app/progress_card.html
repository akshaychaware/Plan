<section class="card">
  <div class="card-header"><h2>{{ title }}</h2></div>
  <div class="progress-wrap">
    <div class="ring" style="--value: {{ progress.percent }}" data-progress="{{ progress.percent }}" role="img" aria-label="{{ progress.percent }}% of training activities done">
      <span>{{ progress.percent }}%</span>
    </div>
    <div>
      <p class="mt-0"><strong>{{ progress.done }} of {{ progress.target }}</strong> planned training activities done.</p>
      <p class="mt-0"><strong>{{ progress.calories|floatformat:"-1" }} kcal</strong> burned.</p>
      <p class="muted m-0">Rest is not counted. Keep the streak going!</p>
    </div>
  </div>
</section>
