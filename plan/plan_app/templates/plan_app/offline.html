{% load static i18n %}<!doctype html>
{% get_current_language as LANGUAGE_CODE %}
<html lang="{{ LANGUAGE_CODE }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4f46e5">
  <title>{% translate "Offline" %} · {% translate "Training Tracker" %}</title>
  <script src="{% static 'plan_app/theme.js' %}?v={{ asset_version }}"></script>
  <link rel="stylesheet" href="{% static 'plan_app/style.css' %}?v={{ asset_version }}">
</head>
<body class="no-tabbar">
  <main class="container auth">
    <div class="card empty">
      <span class="brand-mark"><img src="{% static 'plan_app/icons/icon-192.png' %}" alt="" width="56" height="56"></span>
      <h1>{% translate "You’re offline" %}</h1>
      <p>{% translate "Training Tracker needs a connection to load and save sessions. Reconnect and try again." %}</p>
      <a class="btn" href="/">{% translate "Retry" %}</a>
    </div>
  </main>
</body>
</html>
